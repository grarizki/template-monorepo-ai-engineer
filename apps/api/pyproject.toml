[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "ai-template"
version = "0.1.0"
description = "AI monorepo template for ML prototyping"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.139.0",
    "uvicorn==0.50.2",
    "typer==0.26.8",
    "rich==15.0.0",
    "alembic==1.18.5",
    "numpy==2.5.1",
    "sqlalchemy==2.0.51",
    "scalar-fastapi==1.8.2",
    "pydantic==2.13.4",
]

[project.scripts]
ai-cli = "ai_template.cli:app"

[tool.setuptools.packages.find]
include = ["ai_template*"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
