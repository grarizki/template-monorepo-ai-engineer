[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "ai-template"
version = "0.1.0"
description = "AI monorepo template for ML prototyping"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "typer[all]==0.12.1",
    "rich==13.7.1",
    "alembic==1.13.1",
    "numpy==1.26.4",
    "sqlalchemy==2.0.30",
    "scalar-fastapi==1.8.2",
    "pydantic==2.13.4",
]

[project.scripts]
ai-cli = "ai_template.cli:app"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
