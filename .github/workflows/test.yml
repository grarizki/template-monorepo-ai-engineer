name: Tests Required

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/api/ai_template/**"
      - "apps/web/src/**"

jobs:
  check-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check test files changed
        run: |
          CODE_CHANGED=$(git diff --name-only origin/main...HEAD | grep -E '^apps/(api/ai_template|web/src)/.*\.(py|ts|astro)$' || true)
          TEST_CHANGED=$(git diff --name-only origin/main...HEAD | grep -E '^apps/(api/tests/|web/src/.*\.test\.)' || true)
          if [ -n "$CODE_CHANGED" ] && [ -z "$TEST_CHANGED" ]; then
            echo "Code changed but no tests added. Add tests for your changes."
            echo "Changed files:"
            echo "$CODE_CHANGED"
            exit 1
          fi
          echo "Tests present or no code changes."

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run API tests
        run: |
          cd apps/api
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt -e .
          python -m pytest tests/ -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Web tests
        run: |
          cd apps/web
          pnpm install --frozen-lockfile
          pnpm test
